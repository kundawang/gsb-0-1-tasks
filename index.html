<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>仓库波次拣货路径排程</title>
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>
  <header>
    <h1>仓库波次拣货路径排程</h1>
    <div class="controls">
      <label>波次容量 max_items
        <input id="maxItems" type="number" min="1" step="1" value="10" />
      </label>
      <label>货位上限 pick_list_size
        <input id="pickListSize" type="number" min="1" step="1" value="6" />
      </label>
      <fieldset class="strategy">
        <legend>地图路径策略</legend>
        <label><input type="radio" name="strategy" value="nearest" checked /> 最近邻</label>
        <label><input type="radio" name="strategy" value="lex" /> 字典序</label>
      </fieldset>
      <label class="file">货位图 JSON <input id="warehouseFile" type="file" accept=".json" /></label>
      <label class="file">订单 JSON <input id="ordersFile" type="file" accept=".json" /></label>
    </div>
    <p id="dataStatus" class="status"></p>
  </header>
  <main>
    <section class="map-panel">
      <svg id="map" role="img" aria-label="仓库货位与拣货路径图"></svg>
      <div id="legend" class="legend"></div>
    </section>
    <section class="side-panel">
      <h2>整体汇总</h2>
      <table id="summaryTable" class="summary"></table>
      <h2>波次明细</h2>
      <table id="waveTable">
        <thead>
          <tr>
            <th>波次</th><th>订单</th><th>件数</th><th>货位数</th>
            <th>字典序长度</th><th>最近邻长度</th><th>访问顺序</th><th>状态</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
      <div id="warnings" class="warnings"></div>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
